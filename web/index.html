<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f6f8" />
  <meta name="color-scheme" content="light dark" />
  <title>ClipBoost</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("clipboost-theme");var dark=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);if(dark){d.classList.add("dark");document.querySelector('meta[name="theme-color"]').setAttribute("content","#0b0d12")}var l=localStorage.getItem("clipboost-lang");if(l==="en"||l==="ar"){d.lang=l;d.dir=l==="ar"?"rtl":"ltr"}}catch(e){}})();</script>
  <!--STYLES-->
</head>
<body class="font-sans antialiased">
  <div id="app"><div class="grid min-h-dvh place-items-center bg-canvas text-small text-fg-subtle">Chargement…</div></div>
  <!--SCRIPT-->
</body>
</html>
